name: Generate Snake Animation

on:
  # runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # lets you run it manually from the Actions tab
  workflow_dispatch:

  # runs on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # reads your contribution graph and builds the snake SVGs
      # the snake eats the lowest-contribution days first, then higher ones
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00d9ff

      # pushes the SVGs to the "output" branch so the README can show them
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
